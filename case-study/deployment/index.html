<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malta Airbnb Price Estimator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 560px">
  <h1 class="h3 mb-1">Malta Airbnb Price Estimator</h1>
  <p class="text-muted">Estimate a typical nightly price from a few listing details.</p>

  <form id="form" class="card card-body shadow-sm">
    <div class="mb-3">
      <label for="room_type" class="form-label">Room type</label>
      <select id="room_type" class="form-select" required></select>
    </div>
    <div class="mb-3">
      <label for="neighbourhood" class="form-label">Neighbourhood</label>
      <select id="neighbourhood" class="form-select" required></select>
    </div>
    <div class="mb-3">
      <label for="minimum_nights" class="form-label">Minimum nights</label>
      <input id="minimum_nights" type="number" class="form-control" min="1" value="2" required>
    </div>
    <button class="btn btn-primary" type="submit">Estimate price</button>
  </form>

  <div id="result" class="mt-4"></div>
  <p id="metrics" class="text-muted small mt-4"></p>
</div>

<script>
const $ = id => document.getElementById(id);

// Same origin when served by the API; fall back to local API if opened as a file
const API = location.protocol === "file:" ? "http://127.0.0.1:8000" : "";

function fill(select, values) {
  select.innerHTML = values.map(v => `<option>${v}</option>`).join("");
}

function show(cls, html) {
  $("result").innerHTML = `<div class="alert alert-${cls}">${html}</div>`;
}

// Populate the dropdowns from the API so they always match the model
async function init() {
  try {
    const [rooms, hoods, meta] = await Promise.all(
      ["/room-types", "/neighbourhoods", "/metadata"].map(p => fetch(API + p).then(r => r.json()))
    );
    fill($("room_type"), rooms);
    fill($("neighbourhood"), hoods);
    const m = meta.test_metrics;
    $("metrics").textContent =
      `Model: gradient boosting. Test MAE ≈ €${m.MAE_eur.toFixed(0)}, R² ≈ ${m.R2_eur.toFixed(2)}. ` +
      `Trained on listings up to €${meta.trained_on_price_cap_eur.toFixed(0)}/night.`;
  } catch (e) {
    show("danger", "Could not reach the API. Is it running (python -m uvicorn api:app)?");
  }
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {
    room_type: $("room_type").value,
    neighbourhood: $("neighbourhood").value,
    minimum_nights: Number($("minimum_nights").value),
  };
  try {
    const res = await fetch(API + "/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("Request failed (" + res.status + ")");
    const data = await res.json();
    show("success", `Estimated price: <strong class="fs-4">€${data.predicted_price_eur.toFixed(2)}</strong> per night`);
  } catch (err) {
    show("danger", err.message);
  }
});

init();
</script>
</body>
</html>
